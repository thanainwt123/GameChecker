<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎮 Game Checker</h1>

        <p>เช็กว่าสเปกคอมของคุณเล่นเกมได้หรือไม่</p>

        <hr>

        <h2>เลือกเกม</h2>

<input
    type="text"
    id="searchGame"
    placeholder="🔎 พิมพ์ชื่อเกมเพื่อค้นหา..."
>

<p id="gameCount">กำลังโหลดจำนวนเกม...</p>

<select id="game">
    <option>กำลังโหลดเกม...</option>
</select>

<div id="gameRequirements"></div>

        <h2>สเปกคอมของคุณ</h2>

<label>CPU</label>

<select id="cpu">
    <option value="i5-10400">Intel Core i5-10400</option>
    <option value="i5-12400f">Intel Core i5-12400F</option>
    <option value="i5-13400f">Intel Core i5-13400F</option>
    <option value="i5-14400f">Intel Core i5-14400F</option>

    <option value="i7-10700">Intel Core i7-10700</option>
    <option value="i7-12700">Intel Core i7-12700</option>
    <option value="i7-13700">Intel Core i7-13700</option>

    <option value="r5-3600">AMD Ryzen 5 3600</option>
    <option value="r5-5600">AMD Ryzen 5 5600</option>
    <option value="r5-7600">AMD Ryzen 5 7600</option>

    <option value="r7-5700x">AMD Ryzen 7 5700X</option>
    <option value="r7-7700">AMD Ryzen 7 7700</option>
</select>

<br><br>

<label>GPU</label>

<select id="gpu">
    <option value="gtx1650">NVIDIA GTX 1650</option>
    <option value="gtx1660">NVIDIA GTX 1660</option>
    <option value="gtx1660s">NVIDIA GTX 1660 Super</option>

    <option value="rtx2060">NVIDIA RTX 2060</option>
    <option value="rtx3060">NVIDIA RTX 3060</option>
    <option value="rtx4060">NVIDIA RTX 4060</option>
    <option value="rtx4060ti">NVIDIA RTX 4060 Ti</option>
    <option value="rtx4070">NVIDIA RTX 4070</option>
    <option value="rtx4070s">NVIDIA RTX 4070 Super</option>

    <option value="rx6600">AMD RX 6600</option>
    <option value="rx6700xt">AMD RX 6700 XT</option>
    <option value="rx7600">AMD RX 7600</option>
    <option value="rx7700xt">AMD RX 7700 XT</option>
    <option value="rx7800xt">AMD RX 7800 XT</option>
</select>

<br><br>

<label>RAM</label>

<select id="ram">
    <option value="4">4 GB</option>
    <option value="8">8 GB</option>
    <option value="16">16 GB</option>
    <option value="32">32 GB</option>
    <option value="64">64 GB</option>
</select>

<br><br>

<button onclick="checkGame()">
    🔍 ตรวจสอบสเปก
</button>

<div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
