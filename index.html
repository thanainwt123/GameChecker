<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Game Checker</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<div class="container">


    <!-- ==============================
         หัวเว็บ
         ============================== -->

    <h1>🎮 Game Checker</h1>

    <p>
        เช็กว่าสเปกคอมของคุณเล่นเกมได้หรือไม่
    </p>


    <hr>


    <!-- ==============================
         เลือกเกม
         ============================== -->

    <h2>เลือกเกม</h2>


    <input
        type="text"
        id="searchGame"
        placeholder="🔎 พิมพ์ชื่อเกมเพื่อค้นหา..."
    >


    <p id="gameCount">
        กำลังโหลดจำนวนเกม...
    </p>


    <select id="game">

        <option>
            กำลังโหลดเกม...
        </option>

    </select>


    <!-- ==============================
         สเปกเกม
         ============================== -->

    <div id="gameRequirements"></div>


    <!-- ==============================
         สเปกคอมของผู้ใช้
         ============================== -->

    <h2>
        สเปกคอมของคุณ
    </h2>


    <!-- ==============================
         CPU
         ============================== -->

    <label>
        CPU
    </label>


    <select id="cpu">


        <!-- ==========================
             Intel Core i3
             ========================== -->

        <option value="i3-10100">
            Intel Core i3-10100
        </option>

        <option value="i3-12100f">
            Intel Core i3-12100F
        </option>

        <option value="i3-13100f">
            Intel Core i3-13100F
        </option>


        <!-- ==========================
             Intel Core i5
             ========================== -->

        <option value="i5-10400">
            Intel Core i5-10400
        </option>

        </option>

        <option value="i5-12400f">
            Intel Core i5-12400F
        </option>

        <option value="i5-12600k">
            Intel Core i5-12600K
        </option>

        <option value="i5-13400f">
            Intel Core i5-13400F
        </option>

        <option value="i5-13500">
            Intel Core i5-13500

             Intel Core i7
             ========================== -->

            Intel Core i7-13700
        </option>

        <option value="i7-14700">

        <option value="i7-14700k">

             Intel Core i9

            AMD Ryzen 9 9950X
        </option>

        <option value="r9-9950x3d">
            AMD Ryzen 9 9950X3D
        </option>


    </select>


    <br>
    <br>

         ============================== -->

        <option value="rx9060xt">

        </option>

        <option value="rx9070">
            AMD RX 9070
        </option>

        <option value="rx9070xt">
            AMD RX 9070 XT
        </option>


    </select>


    <br>
    <br>


    <!-- ==============================
         RAM
         ============================== -->

    <label>
        RAM
    </label>


    <select id="ram">

        <option value="4">
            4 GB
        </option>

        <option value="8">
            8 GB
        </option>

        <option value="12">
            12 GB
        </option>

        <option value="16" selected>
            16 GB
        </option>

        <option value="24">
            24 GB
        </option>

        <option value="32">
            32 GB
        </option>

        <option value="64">
            64 GB
        </option>

    </select>


    <br>
    <br>


    <!-- ==============================
         ปุ่มตรวจสอบ
         ============================== -->

    <button onclick="checkGame()">

        🔍 ตรวจสอบสเปก

    </button>


    <!-- ==============================
         ผลลัพธ์
         ============================== -->

    <div id="result"></div>


</div>


<!-- ==============================

     ============================== -->

<script src="script.js"></script>


</body>

</html>
